# Colorscheme
include tokyonight_night.conf

# Font
font_family      family="AdwaitaMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Resizing
window_resize_step_cells 1
window_resize_step_lines 1

# Doesn't work with wayland
# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.resize_in_steps
# resize_in_steps yes

# Performance
input_delay 0
# repaint_delay 2
sync_to_monitor yes
wayland_enable_ime no

# Keymaps
clear_all_shortcuts yes

# Fullscreen
map f11 toggle_fullscreen

# Increase font size
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+kp_add change_font_size all +1.0

# Decrease font size
map ctrl+minus change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0

# Clipboard
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

# Reload config
map ctrl+shift+f5 load_config_file
