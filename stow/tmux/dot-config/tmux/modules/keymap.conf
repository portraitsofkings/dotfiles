# ~~~ Setup ~~~

unbind l
unbind z
unbind ?
unbind !
unbind '"'
unbind %
unbind &
unbind o
unbind p
unbind n
unbind s
unbind c
unbind d
unbind x
unbind C-b

# Changing prefix, according to instructions in tmux man page
set -g prefix C-a
bind C-a send-prefix

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# ~~~ Keytables ~~~

# Window
bind w switch-client -T window
bind C-w switch-client -T window

# Window-move
bind -T window m switch-client -T window-move
bind -T window C-m switch-client -T window-move

# Tab
bind t switch-client -T tab
bind C-t switch-client -T tab

# Tab-move
bind -T tab m switch-client -T tab-move
bind -T tab C-m switch-client -T tab-move

# Command
bind c switch-client -T command
bind C-c switch-client -T command

# ~~~ Root keymaps ~~~

# Vim-aware resizing
bind -N "Root: Resize Window Left"  -n 'M-h' if "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind -N "Root: Resize Window Down"  -n 'M-j' if "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind -N "Root: Resize Window Up"    -n 'M-k' if "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind -N "Root: Resize Window Right" -n 'M-l' if "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# Vim-aware cursor movement
bind -N "Root: Select Window Left"  -n 'C-h' if "$is_vim" { send-keys C-h } { if -F '#{pane_at_left}'   {} { select-pane -L } }
bind -N "Root: Select Window Down"  -n 'C-j' if "$is_vim" { send-keys C-j } { if -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -N "Root: Select Window Up"    -n 'C-k' if "$is_vim" { send-keys C-k } { if -F '#{pane_at_top}'    {} { select-pane -U } }
bind -N "Root: Select Window right" -n 'C-l' if "$is_vim" { send-keys C-l } { if -F '#{pane_at_right}'  {} { select-pane -R } }

# ~~~ Copy Mode Keymaps ~~~

# Copy mode cursor movement
bind -N "Copy-Mode: Select Window Left"  -T copy-mode-vi 'C-h' if -F '#{pane_at_left}'   {} { select-pane -L }
bind -N "Copy-Mode: Select Window Down"  -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' {} { select-pane -D }
bind -N "Copy-Mode: Select Window Up"    -T copy-mode-vi 'C-k' if -F '#{pane_at_top}'    {} { select-pane -U }
bind -N "Copy-Mode: Select Window Right" -T copy-mode-vi 'C-l' if -F '#{pane_at_right}'  {} { select-pane -R }

# ~~~ Prefix keymaps ~~~

# Show help
bind ? {
  list-keys -NT root
  list-keys -NT window   -P "w"
  list-keys -NT tab      -P "t"
  list-keys -NT tab-move -P "tm"
  list-keys -NT command  -P "c"
  list-keys -NT copy-mode-vi
  list-keys -NT prefix
}

# Normal ^H/J/K/L via prefix
bind -r "C-h" send-keys "C-h"
bind -r "C-j" send-keys "C-j"
bind -r "C-k" send-keys "C-k"
bind -r "C-l" send-keys "C-l"

# ~~~ Window keymaps ~~~

bind -r -N "Window: Horizontal Split"  -T window s split-window -v -c "#{pane_current_path}"
bind -r -N "Window: Vertical Split"    -T window v split-window -h -c "#{pane_current_path}"
bind -r -N "Window: Toggle Zoom"       -T window z resize-pane -Z
bind    -N "Window: Move to a New Tab" -T window t break-pane
bind    -N "Window: Close"             -T window c { confirm -p "Close this window? [Y/n]" -y { kill-pane } }
bind    -N "Window: Only"              -T window o { confirm -p "Keep only this window? [Y/n]" -y { kill-pane -a } }

# Move cursor only between tmux panes
bind -r -N "Window: Select Left"  -T window "C-h" if -F "#{pane_at_left}"   {} { select-pane -L }
bind -r -N "Window: Select Down"  -T window "C-j" if -F "#{pane_at_bottom}" {} { select-pane -D }
bind -r -N "Window: Select Up"    -T window "C-k" if -F "#{pane_at_top}"    {} { select-pane -U }
bind -r -N "Window: Select Right" -T window "C-l" if -F "#{pane_at_right}"  {} { select-pane -R }

# Resize only tmux panes
bind -r -N "Window: Resize Left"  -T window "M-h" resize-pane -L 3
bind -r -N "Window: Resize Down"  -T window "M-j" resize-pane -D 3
bind -r -N "Window: Resize Up"    -T window "M-k" resize-pane -U 3
bind -r -N "Window: Resize Right" -T window "M-l" resize-pane -R 3

# ~~~ Window Move keymaps ~~~

bind -r -N "Window Move: Swap Left"  -T window-move h if -F '#{pane_at_left}'   {} { swap-pane -d -t:."{left-of}" }
bind -r -N "Window Move: Swap Down"  -T window-move j if -F '#{pane_at_bottom}' {} { swap-pane -d -t:."{down-of}" }
bind -r -N "Window Move: Swap Up"    -T window-move k if -F '#{pane_at_top}'    {} { swap-pane -d -t:."{up-of}" }
bind -r -N "Window Move: Swap Right" -T window-move l if -F '#{pane_at_right}'  {} { swap-pane -d -t:."{right-of}" }

# ~~~ Tab keymaps ~~~

bind -r -N "Tab: Previous Tab" -T tab h previous-window
bind -r -N "Tab: Previous Tab" -T tab C-h previous-window
bind -r -N "Tab: Next Tab"     -T tab l next-window
bind -r -N "Tab: Next Tab"     -T tab C-l next-window
bind -r -N "Tab: New"          -T tab n new-window -a
bind -r -N "Tab: Close"        -T tab c { confirm -p "Close this tab? [Y/n]" -y { kill-window } }

# ~~~ Tab Move keymaps ~~~

bind -r -N "Tab Move: Left"  -T tab-move h { swap-window -d -t -1 }
bind -r -N "Tab Move: Right" -T tab-move l { swap-window -d -t +1 }

# ~~~ Command keymaps ~~~

bind -N "Command: Sessions"  -T command s choose-tree -Zs
bind -N "Command: Tabs"      -T command t choose-tree -Zw
bind -N "Command: Windows"   -T command w choose-tree -Z
bind -N "Command: Detach"    -T command d detach-client
bind -N "Command: Copy Mode" -T command c copy-mode

# vim:ft=tmux
