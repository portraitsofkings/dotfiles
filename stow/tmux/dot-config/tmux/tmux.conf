# ~~~~~~~~~~ Options ~~~~~~~~~~

# Set $TERM
set -g default-terminal "tmux-256color"
# Enable true RGB
set -g terminal-overrides "*:RGB"

# Windows start at index 1
set -g base-index 1
# Panes start at index 1
set -g pane-base-index 1
# After a window closes, renumber the rest
set -g renumber-windows on

# Enable mouse support
set -g mouse on
# React to focus events
set -g focus-events on

# Scrollback history size
set -g history-limit 10000

# Set pane size to N when switching layout
set -g main-pane-height 50\%
set -g main-pane-width 50\%

# Update statusbar every N seconds
set -g status-interval 5
# Wait N ms before letting <Esc> key into pane process
set -g escape-time 0
# Wait N ms for repeatable keymaps
set -g repeat-time 500
# Statusbar messages are shown for N ms
set -g display-time 4000
# Pane numbers are shown for N ms
set -g display-panes-time 4000

# ~~~~~~~~~~ Style ~~~~~~~~~~

set -g @color-primary "red"
set -g @color-default "default"
set -g @color-zoomed "yellow"
set -g @color-bell "red"

set -g status-justify absolute-centre
set -g status-style "bg=#{@color-default},fg=#{@color-default},bold"

set -g status-left " #{?client_prefix,,} #{?#{!=:#{client_key_table},root},· #{client_key_table},}"
set -g status-left-style "fg=#{@color-primary},bg=#{@color-default}"
set -g status-left-length 40

set -g status-right "session: #S · #(date "+%H:%M") "
set -g status-right-style "fg=#{@color-primary}"
set -g status-right-length 40

set -g window-status-format "#W "
set -g window-status-current-format "#W "
set -g window-status-current-style "#{?window_zoomed_flag,fg=#{@color-zoomed},fg=#{@color-primary}}"
set -g window-status-bell-style "fg=#{@color-bell}"

# ~~~~~~~~~~ Keymaps ~~~~~~~~~~

# Changing prefix, according to instructions in tmux man page
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind l
unbind z
unbind ?
unbind !
unbind '"'
unbind %
unbind &
unbind o
unbind p
unbind n
unbind s
unbind c
unbind d
unbind x

bind 'C-h' send-keys 'C-h'
bind 'C-j' send-keys 'C-j'
bind 'C-k' send-keys 'C-k'
bind 'C-l' send-keys 'C-l'

bind ? {
  list-keys -P "w" -NT window
  list-keys -P "t" -NT tab
  list-keys -P "tm" -NT tab-move
  list-keys -P "c" -NT command
  list-keys -NT prefix
  list-keys -NT root
}

bind w switch-client -T window
bind C-w switch-client -T window
bind -r -N "Window: Horizontal Split" -T window s split-window -v
bind -r -N "Window: Vertical Split" -T window v split-window -h
bind -N "Window: Close" -T window c {
  confirm -p "Close this window? [Y/n]" -y {
    kill-pane
  }
}
bind -N "Window: Only" -T window o {
  confirm -p "Keep only this window? [Y/n]" -y {
    kill-pane -a
  }
}
bind -r -N "Window: Toggle Zoom" -T window z {
  resize-pane -Z
}
bind -N "Window: Move to a New Tab" -T window t {
  break-pane
}

bind t switch-client -T tab
bind C-t switch-client -T tab
bind -r -N "Tab: Previous Tab" -T tab h previous-window
bind -r -N "Tab: Previous Tab" -T tab C-h previous-window
bind -r -N "Tab: Next Tab" -T tab l next-window
bind -r -N "Tab: Next Tab" -T tab C-l next-window
bind -r -N "Tab: New" -T tab n new-window
bind -r -N "Tab: Close" -T tab c {
  confirm -p "Close this tab? [n/Y]" -y {
    kill-window
  }
}

bind -T tab m switch-client -T tab-move
bind -T tab C-m switch-client -T tab-move
bind -r -N "Tab Move: Left" -T tab-move h {
  swap-window -d -t -1
}
bind -r -N "Tab Move: Right" -T tab-move l {
  swap-window -d -t +1
}

bind c switch-client -T command
bind C-c switch-client -T command
bind -N "Command: Sessions" -T command s choose-tree -Zs
bind -N "Command: Tabs" -T command t choose-tree -Zw
bind -N "Command: Windows" -T command w choose-tree -Z
bind -N "Command: Detach" -T command d detach-client

# vim-tmux-navigator
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

